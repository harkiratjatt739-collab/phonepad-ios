name: Build iPhone app (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy controller page from server.py
        run: python3 ios/make_html.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project PhonePad.xcodeproj -scheme PhonePad \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PhonePad.app Payload/
          zip -qry PhonePad.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhonePad-ipa
          path: ios/PhonePad.ipa
